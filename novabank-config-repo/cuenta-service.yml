server:
  port: 8082 # Puerto del microservicio de cuentas
  forward-headers-strategy: framework

spring:
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/novabank_cuentas # Base de datos de PostgreSQL
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:root}
        
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/ # URL del Eureka Server
      
resilience4j:
  circuitbreaker:
    instances:
      cliente-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      cliente-service:
        max-attempts: 3
        wait-duration: 1s
        
springdoc:
  api-docs:
    path: /cuentas/v3/api-docs
    
management:
  tracing:
    sampling:
      probability: 1.0
