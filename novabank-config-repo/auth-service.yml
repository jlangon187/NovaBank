server:
  port: 8084 # Puerto del microservicio de operaciones
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/novabank_usuarios # Base de datos de PostgreSQL
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD}
    
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/ # URL del Eureka Server

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  
springdoc:
  api-docs:
    path: /api/auth/v3/api-docs
