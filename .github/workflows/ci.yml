name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B -ntp -pl cliente-service,cuenta-service,operacion-service -am test
        env:
          SPRING_CLOUD_CONFIG_ENABLED: "false"
          EUREKA_CLIENT_ENABLED: "false"
